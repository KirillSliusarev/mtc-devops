---
# Custom Grafana dashboard for Chaos Engineering demo
# 4 panels, each clearly reacts to one or more chaos scenarios
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus
data:
  chaos-demo.json: |
    {
      "annotations": {"list": [{"name": "Scenarios", "enable": true, "iconColor": "rgba(0, 211, 255, 1)", "tags": ["scenario"]}]},
      "title": "Chaos Engineering Demo",
      "uid": "chaos-demo",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "tags": ["chaos", "istio"],
      "time": {"from": "now-30m", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "title": "Backend P95 Response Time (ms)",
          "description": "Spikes during Scenario 1 (HTTP Latency) and Scenario 3 (DB Latency)",
          "type": "timeseries",
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {"defaults": {"unit": "ms"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload=\"backend\"}[30s])) by (le))",
              "legendFormat": "P95 backend",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload=\"backend\"}[30s])) by (le))",
              "legendFormat": "P50 backend",
              "refId": "B"
            }
          ]
        },
        {
          "id": 2,
          "title": "Backend Request Rate & Errors (req/s)",
          "description": "Errors spike during Scenario 4 (Network Partition — backend returns 503)",
          "type": "timeseries",
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=\"backend\"}[30s]))",
              "legendFormat": "Total requests",
              "refId": "A"
            },
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=\"backend\",response_code=~\"5..\"}[30s]))",
              "legendFormat": "5xx errors",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "Harbor Request Rate & Errors (req/s)",
          "description": "Errors spike during Scenario 2 (HTTP 500 abort injection)",
          "type": "timeseries",
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 9},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=~\"harbor-nginx|harbor-core|harbor-portal\"}[30s]))",
              "legendFormat": "Total Harbor requests",
              "refId": "A"
            },
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=~\"harbor-nginx|harbor-core|harbor-portal\",response_code=~\"5..\"}[30s]))",
              "legendFormat": "5xx errors",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "title": "Backend Success vs Error Rate (%)",
          "description": "Success drops / Error rises during Scenario 4 (Network Partition)",
          "type": "timeseries",
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 9},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=\"backend\",response_code!~\"5..\"}[30s])) / sum(rate(istio_requests_total{destination_workload=\"backend\"}[30s])) * 100",
              "legendFormat": "Success rate %",
              "refId": "A"
            },
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=\"backend\",response_code=~\"5..\"}[30s])) / sum(rate(istio_requests_total{destination_workload=\"backend\"}[30s])) * 100",
              "legendFormat": "Error rate %",
              "refId": "B"
            }
          ]
        }
      ]
    }
