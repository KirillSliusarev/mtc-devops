---
# Custom Grafana dashboard for Chaos Engineering demo
# Simple, reliable, uses metrics that actually exist in our setup
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus
data:
  chaos-demo.json: |
    {
      "annotations": {"list": []},
      "title": "Chaos Engineering Demo",
      "uid": "chaos-demo",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": {"from": "now-15m", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {"text": "Prometheus", "value": "Prometheus"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total[1m])) by (destination_workload)",
              "legendFormat": "{{destination_workload}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "id": 2,
          "title": "P95 Response Time (ms)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket[1m])) by (le, destination_workload))",
              "legendFormat": "p95 {{destination_workload}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ms"}, "overrides": []}
        },
        {
          "id": 3,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"4..|5..\"}[1m])) by (destination_workload) / sum(rate(istio_requests_total[1m])) by (destination_workload) * 100",
              "legendFormat": "{{destination_workload}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "percent", "max": 100, "min": 0}, "overrides": []}
        },
        {
          "id": 4,
          "title": "Success Rate (%)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "target": [],
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code!~\"4..|5..\"}[1m])) by (destination_workload) / sum(rate(istio_requests_total[1m])) by (destination_workload) * 100",
              "legendFormat": "{{destination_workload}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "percent", "max": 100, "min": 0}, "overrides": []}
        },
        {
          "id": 5,
          "title": "DB Query Latency (ms)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_tcp_connections_closed_total[1m])) by (le, destination_workload))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Active Connections",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 16},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "sum(istio_tcp_connections_opened_total) by (destination_workload)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Pod Status",
          "type": "table",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "kube_pod_status_phase{namespace=~\"demo-app|harbor\"}",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ]
        }
      ]
    }
