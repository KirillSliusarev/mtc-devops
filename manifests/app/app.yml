---
# Sample multi-tier application for Chaos Engineering demo
# Frontend (nginx) → Backend (python+psycopg2) → DB (postgres)
# All accessible through Istio Gateway: http://<VM-IP>:30133

apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    istio-injection: enabled
---
# Frontend config (HTML + nginx reverse proxy to backend)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: demo-app
data:
  index.html: |
    <!DOCTYPE html>
    <html><head><meta charset="utf-8"><title>Chaos Demo</title></head>
    <body>
    <h1>Chaos Demo App</h1>
    <h2>Backend Status</h2>
    <pre id="status" style="font-size:16px; background:#f0f0f0; padding:15px; border-radius:5px;">Loading...</pre>
    <p>Auto-refresh every 2 seconds. Open Grafana in another tab.</p>
    <script>
    async function check() {
      try {
        const r = await fetch('/api/status');
        const d = await r.json();
        const color = d.db === 'connected' ? '#2e7d32' : '#c62828';
        document.getElementById('status').innerHTML =
          'HTTP: ' + r.status + '\n' +
          'DB: <span style="color:'+color+'"><b>' + d.db + '</b></span>\n' +
          'DB response: ' + d.db_response_ms + ' ms\n' +
          'Insert ID: ' + (d.last_insert_id || 'N/A');
      } catch(e) {
        document.getElementById('status').innerHTML = 'ERROR: ' + e;
      }
    }
    check();
    setInterval(check, 2000);
    </script>
    </body></html>
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: html
        configMap:
          name: frontend-config
          items:
          - key: index.html
            path: index.html
      - name: config
        configMap:
          name: frontend-config
          items:
          - key: default.conf
            path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
---
# Backend (real DB connection via psycopg2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: python:3.11-slim
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "demo"
        - name: DB_USER
          value: "demo"
        - name: DB_PASS
          value: "demo123"
        - name: DB_DELAY_MS
          value: "0"
        command: ["sh", "-c"]
        args:
          - |
            pip install --quiet psycopg2-binary &&
            python3 - <<'PYEOF'
            import os, time, json, socket, psycopg2
            from http.server import BaseHTTPRequestHandler, HTTPServer

            DB_HOST=os.environ.get("DB_HOST","db")
            DB_PORT=os.environ.get("DB_PORT","5432")
            DB_NAME=os.environ.get("DB_NAME","demo")
            DB_USER=os.environ.get("DB_USER","demo")
            DB_PASS=os.environ.get("DB_PASS","demo123")
            DB_DELAY_MS=int(os.environ.get("DB_DELAY_MS","0"))

            def get_db():
                if DB_DELAY_MS > 0:
                    time.sleep(DB_DELAY_MS / 1000.0)
                return psycopg2.connect(host=DB_HOST,port=DB_PORT,dbname=DB_NAME,
                    user=DB_USER,password=DB_PASS,connect_timeout=5,
                    options="-c statement_timeout=5000")

            def init_db():
                for i in range(30):
                    try:
                        c=get_db(); cur=c.cursor()
                        cur.execute("CREATE TABLE IF NOT EXISTS counter (id SERIAL PRIMARY KEY, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)")
                        c.commit(); cur.close(); c.close()
                        print("DB initialized"); return
                    except Exception as e:
                        print(f"Waiting for DB... ({i+1}/30): {e}"); time.sleep(2)

            class H(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path=="/health":
                        self._r(200,{"status":"ok"})
                    elif self.path=="/api/status":
                        s=time.time()
                        try:
                            c=get_db(); cur=c.cursor()
                            cur.execute("INSERT INTO counter (created_at) VALUES (NOW()) RETURNING id")
                            row=cur.fetchone(); c.commit(); cur.close(); c.close()
                            ms=round((time.time()-s)*1000)
                            self._r(200,{"db":"connected","db_response_ms":ms,"last_insert_id":row[0]})
                        except Exception as e:
                            ms=round((time.time()-s)*1000)
                            self._r(503,{"db":"error","error":str(e),"db_response_ms":ms})
                    elif self.path=="/api/db-check":
                        s=time.time()
                        try:
                            sock=socket.create_connection((DB_HOST,int(DB_PORT)),timeout=5); sock.close()
                            tcp=round((time.time()-s)*1000)
                        except Exception as e:
                            self._r(503,{"tcp":"failed","error":str(e)}); return
                        s2=time.time()
                        try:
                            c=get_db(); cur=c.cursor()
                            cur.execute("SELECT count(*) FROM counter")
                            cnt=cur.fetchone()[0]; cur.close(); c.close()
                            sql=round((time.time()-s2)*1000)
                            self._r(200,{"tcp_ms":tcp,"sql_ms":sql,"total_rows":cnt})
                        except Exception as e:
                            sql=round((time.time()-s2)*1000)
                            self._r(503,{"tcp_ms":tcp,"sql":"failed","error":str(e),"sql_ms":sql})
                    else:
                        self._r(200,{"service":"backend","version":"2.0"})
                def _r(self,code,data):
                    b=json.dumps(data,indent=2).encode()
                    self.send_response(code)
                    self.send_header("Content-Type","application/json")
                    self.send_header("Content-Length",str(len(b)))
                    self.end_headers(); self.wfile.write(b)
                def log_message(self,f,*a):
                    print(f"{self.address_string()} - {f%a}")

            init_db()
            print(f"Backend on :5000, DB={DB_HOST}:{DB_PORT}")
            HTTPServer(("0.0.0.0",5000),H).serve_forever()
            PYEOF
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
    name: http
---
# Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "demo"
        - name: POSTGRES_USER
          value: "demo"
        - name: POSTGRES_PASSWORD
          value: "demo123"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: demo-app
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
    name: tcp
