---
# Istio Gateway — единая точка входа
# Порт 8080 (непривилегированный, т.к. IG pod работает не от root)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 8080
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: demo-vs
  namespace: demo-app
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/demo-gateway
  http:
  - match:
    - uri:
        prefix: /api/
    route:
    - destination:
        host: backend
        port:
          number: 5000
  - match:
    - uri:
        prefix: /health
    route:
    - destination:
        host: backend
        port:
          number: 5000
  - route:
    - destination:
        host: frontend
        port:
          number: 80
---
# mTLS strict for demo-app namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: demo-app
spec:
  mtls:
    mode: STRICT
