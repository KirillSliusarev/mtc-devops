---
# Istio Gateway — единая точка входа на порт 30133
# Маршруты: / → frontend, /api/ и /health → backend
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo-app
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: demo-vs
  namespace: demo-app
spec:
  hosts:
  - "*"
  gateways:
  - demo-gateway
  http:
  # API routes → backend
  - match:
    - uri:
        prefix: /api/
    route:
    - destination:
        host: backend
        port:
          number: 5000
  - match:
    - uri:
        prefix: /health
    route:
    - destination:
        host: backend
        port:
          number: 5000
  # Everything else → frontend
  - route:
    - destination:
        host: frontend
        port:
          number: 80
---
# mTLS strict for demo-app namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: demo-app
spec:
  mtls:
    mode: STRICT
