all:
  hosts:
    target:
      # Эти значения генерируются entrypoint.sh из переменных окружения.
      # Для ручного запуска без Docker укажите свои значения здесь.
      ansible_host: "{{ target_host }}"
      ansible_port: "{{ target_port | default(22) }}"
      ansible_user: "{{ target_user }}"
      ansible_password: "{{ target_password }}"
      ansible_become: true
      ansible_become_password: "{{ target_password }}"
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  vars:
    # Версии
    k3s_version: "v1.31.4+k3s1"
    istio_version: "1.24.0"
    harbor_version: "latest"

    # Сеть
    app_nodeport: 30133
    grafana_nodeport: 30000
    harbor_nodeport: 30002

    # Harbor
    harbor_admin_password: "Harbor12345"

    # Docker
    docker_user: "{{ target_user }}"
