---
# Harbor registry installation role
# Uses helm CLI directly (no Python kubernetes dependency)

- name: Create Harbor namespace with Istio injection
  ansible.builtin.shell: |
    kubectl create namespace harbor --dry-run=client -o yaml | kubectl apply -f -
    kubectl label namespace harbor istio-injection=enabled --overwrite
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Add Harbor Helm repository
  ansible.builtin.shell: |
    helm repo add harbor https://helm.goharbor.io
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Check if Harbor is already installed
  ansible.builtin.shell: helm list -n harbor -o json 2>/dev/null | grep -q harbor
  register: harbor_check
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  failed_when: false

- name: Write Harbor values file
  ansible.builtin.copy:
    dest: /tmp/harbor-values.yaml
    content: |
      expose:
        type: nodePort
        tls:
          enabled: false
        nodePort:
          ports:
            http:
              nodePort: 30002
      externalURL: "http://{{ ansible_host }}:30002"
      harborAdminPassword: "{{ harbor_admin_password | default('Harbor12345') }}"
      core:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
      portal:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      registry:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
      database:
        internal:
          persistentVolumeClaim:
            size: 1Gi
      redis:
        internal:
          persistentVolumeClaim:
            size: 1Gi
      persistence:
        persistentVolumeClaim:
          registry:
            size: 5Gi
      trivy:
        enabled: false
      notary:
        enabled: false
      chartmuseum:
        enabled: false

- name: Install Harbor via Helm
  ansible.builtin.command: >
    helm install harbor harbor/harbor
    -n harbor
    -f /tmp/harbor-values.yaml
    --timeout 5m
    --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: harbor_check.rc != 0

- name: Wait for Harbor to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods --all
    -n harbor --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
