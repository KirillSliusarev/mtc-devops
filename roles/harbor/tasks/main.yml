---
# Harbor registry installation role
# Deploys Harbor via Helm with minimal resource footprint (1 replica each)

- name: Add Harbor Helm repository
  kubernetes.core.helm_repository:
    name: harbor
    repo_url: https://helm.goharbor.io
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Create Harbor namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: harbor
        labels:
          istio-injection: enabled
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Check if Harbor is already installed
  kubernetes.core.helm_info:
    name: harbor
    namespace: harbor
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: harbor_check
  failed_when: false
  changed_when: false

- name: Install Harbor via Helm
  kubernetes.core.helm:
    name: harbor
    chart_ref: harbor/harbor
    release_namespace: harbor
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      expose:
        type: nodePort
        tls:
          enabled: false
        nodePort:
          ports:
            http:
              nodePort: 30002
      externalURL: "http://{{ ansible_host }}:30002"
      harborAdminPassword: "{{ harbor_admin_password | default('Harbor12345') }}"
      # Minimal resources — 1 replica for each component
      core:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
      portal:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      registry:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
      database:
        internal:
          persistentVolumeClaim:
            size: 1Gi
      redis:
        internal:
          persistentVolumeClaim:
            size: 1Gi
      persistence:
        persistentVolumeClaim:
          registry:
            size: 5Gi
      # Disable components not needed for MVP
      trivy:
        enabled: false
      notary:
        enabled: false
      chartmuseum:
        enabled: false
    wait: true
    wait_timeout: 5m
  when: harbor_check.status is undefined or harbor_check.status | length == 0
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Harbor to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods --all
    -n harbor --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
