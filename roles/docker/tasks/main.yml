---
# Ansible role: docker
# Установка Docker CE на Ubuntu 22.04 (amd64).
# Все шаги идемпотентны — повторный запуск не должен ничего ломать.

- name: Установить зависимости apt (prerequisites)
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present
    update_cache: true

- name: Создать keyring-директорию для Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Скачать официальный Docker GPG key (dearmored)
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Добавить официальный Docker APT-репозиторий
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Установить Docker CE и плагины
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Создать /etc/docker для daemon.json
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Настроить daemon.json с log limits
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        }
      }
  notify: Reload and restart docker

- name: Включить и запустить docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Добавить пользователя в группу docker
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
