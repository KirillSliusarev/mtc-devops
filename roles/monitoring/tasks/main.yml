---
# Monitoring role: kube-prometheus-stack (lightweight)
# Prometheus + Grafana + Istio metrics
# During chaos demo pauses, examiner checks Grafana to see degradation.

- name: Add prometheus-community Helm repo
  ansible.builtin.shell: |
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Create monitoring namespace
  ansible.builtin.shell: |
    kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Check if kube-prometheus-stack is installed
  ansible.builtin.shell: helm list -n monitoring -o json 2>/dev/null | grep -q kube-prometheus
  register: monitoring_check
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  failed_when: false

- name: Write monitoring values
  ansible.builtin.copy:
    dest: /tmp/monitoring-values.yaml
    content: |
      # Minimal resources for single-node k3s
      prometheus:
        prometheusSpec:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          retention: 2h
          scrapeInterval: 15s
      
      grafana:
        enabled: true
        image:
          tag: 10.4.1
        adminPassword: "admin"
        service:
          type: NodePort
          nodePort: 30000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # No gnetId dashboards — they're unreliable and often use wrong metrics.
        # Instead, we deploy a custom dashboard via ConfigMap (chaos-dashboard.yml)
        # and Istio ServiceMonitors separately after helm install.
        dashboardProviders: {}
      
      # Disable heavy components
      alertmanager:
        enabled: false
      nodeExporter:
        enabled: true
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
      
      kubeStateMetrics:
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi

- name: Install or upgrade kube-prometheus-stack
  ansible.builtin.command: >
    helm upgrade --install kube-prometheus
    prometheus-community/kube-prometheus-stack
    -n monitoring
    -f /tmp/monitoring-values.yaml
    --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for monitoring pods to be ready
  ansible.builtin.shell: |
    kubectl wait --for=condition=Ready pods --all -n monitoring --timeout=600s || true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Display monitoring info
  ansible.builtin.debug:
    msg:
      - "Monitoring deployed!"
      - "Grafana: http://{{ ansible_host }}:30000 (admin / admin)"
      - "Dashboards: Chaos Engineering → Istio Mesh, Istio Service, Istio Workload"
      - "During chaos demo: watch p95 latency, error rate, success rate"

- name: Apply Istio ServiceMonitors and PodMonitors
  ansible.builtin.shell: |
    kubectl apply -f - <<'YEOF'
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: istiod
      namespace: monitoring
      labels:
        release: kube-prometheus
    spec:
      namespaceSelector:
        matchNames: [istio-system]
      selector:
        matchLabels: {app: istiod}
      endpoints:
      - {port: http-monitoring, interval: 15s, path: /metrics}
    ---
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: istio-ingressgateway
      namespace: monitoring
      labels:
        release: kube-prometheus
    spec:
      namespaceSelector:
        matchNames: [istio-system]
      selector:
        matchLabels: {app: istio-ingressgateway}
      endpoints:
      - {port: http-envoy-prom, interval: 15s, path: /stats/prometheus}
    ---
    apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    metadata:
      name: istio-proxies
      namespace: monitoring
      labels:
        release: kube-prometheus
    spec:
      namespaceSelector:
        matchNames: [demo-app]
      selector:
        matchLabels: {security.istio.io/tlsMode: istio}
      podMetricsEndpoints:
      - {port: http-envoy-prom, interval: 15s, path: /stats/prometheus}
    YEOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Apply custom Chaos Engineering dashboard
  ansible.builtin.copy:
    dest: /tmp/chaos-dashboard.yml
    content: |
      {% raw %}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: chaos-dashboard
        namespace: monitoring
        labels:
          grafana_dashboard: "1"
          release: kube-prometheus
      data:
        chaos-demo.json: |
          {"title":"Chaos Engineering Demo","uid":"chaos-demo","schemaVersion":39,"version":1,"refresh":"5s","time":{"from":"now-15m","to":"now"},"panels":[{"id":1,"title":"Request Rate (req/s)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"expr":"sum(rate(istio_requests_total[1m])) by (destination_workload)","legendFormat":"{{destination_workload}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]}},{"id":2,"title":"P95 Response Time (ms)","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":0},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"expr":"histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket[1m])) by (le, destination_workload))","legendFormat":"p95 {{destination_workload}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"ms"},"overrides":[]}},{"id":3,"title":"Error Rate (%)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":8},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"expr":"sum(rate(istio_requests_total{response_code=~\"4..|5..\"}[1m])) by (destination_workload) / sum(rate(istio_requests_total[1m])) by (destination_workload) * 100","legendFormat":"{{destination_workload}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","max":100,"min":0},"overrides":[]}},{"id":4,"title":"Success Rate (%)","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":8},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"expr":"sum(rate(istio_requests_total{response_code!~\"4..|5..\"}[1m])) by (destination_workload) / sum(rate(istio_requests_total[1m])) by (destination_workload) * 100","legendFormat":"{{destination_workload}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","max":100,"min":0},"overrides":[]}}]}
      {% endraw %}

- name: Apply dashboard
  ansible.builtin.shell: kubectl apply -f /tmp/chaos-dashboard.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for Prometheus targets to be up
  ansible.builtin.shell: |
    sleep 15
  changed_when: false
