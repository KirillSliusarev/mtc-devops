---
# Sample application deployment role
# Deploys frontend + backend + DB + Istio Gateway

- name: Create demo-app namespace with Istio injection
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/../../manifests/app/app.yml"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true
    wait_timeout: 180

- name: Deploy Istio Gateway and VirtualService
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/../../manifests/app/gateway.yml"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Wait for application pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods --all
    -n demo-app --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Display application access info
  ansible.builtin.debug:
    msg:
      - "================================================"
      - "Application deployed!"
      - "App URL: http://{{ ansible_host }}:30080"
      - "Check: kubectl get pods -n demo-app"
      - "================================================"
