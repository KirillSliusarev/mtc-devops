---
# Sample application deployment role
# Copy manifests to target VM, then apply

- name: Copy app manifest to target
  ansible.builtin.copy:
    src: /ansible/manifests/app/app.yml
    dest: /tmp/app.yml
    mode: "0644"

- name: Copy gateway manifest to target
  ansible.builtin.copy:
    src: /ansible/manifests/app/gateway.yml
    dest: /tmp/gateway.yml
    mode: "0644"

- name: Apply app manifest
  ansible.builtin.command: kubectl apply -f /tmp/app.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Apply Istio gateway
  ansible.builtin.command: kubectl apply -f /tmp/gateway.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for application pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods --all
    -n demo-app --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Display application access info
  ansible.builtin.debug:
    msg:
      - "Application deployed!"
      - "Harbor UI: http://{{ ansible_host }}:30002"
      - "Istio Ingress: http://{{ ansible_host }}:30133"
