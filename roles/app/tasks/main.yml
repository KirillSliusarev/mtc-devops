---
# Sample application deployment role
# Uses kubectl apply directly (no Python kubernetes dependency)

- name: Deploy application manifests
  ansible.builtin.shell: |
    kubectl apply -f {{ role_path }}/../../manifests/app/app.yml
    kubectl apply -f {{ role_path }}/../../manifests/app/gateway.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for application pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods --all
    -n demo-app --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Display application access info
  ansible.builtin.debug:
    msg:
      - "Application deployed!"
      - "Frontend (via Istio Ingress): http://{{ ansible_host }}:30080 (if NodePort configured)"
      - "Harbor UI: http://{{ ansible_host }}:30002"
      - "Check pods: kubectl get pods -n demo-app"
